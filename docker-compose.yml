services:
  kim-secretary-api:
    image: docker.io/junho5336/kim-secretary-api:prod
    container_name: kim-secretary-api
    restart: unless-stopped

    environment:
      # Application Configuration
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: Asia/Seoul

      # Slack Configuration
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

      # Server Configuration
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Security (Optional)
      API_KEY: ${API_KEY:-}

      # Notion User to Database Mapping
      USER_DATABASE_MAPPING: ${USER_DATABASE_MAPPING}

    ports:
      - "8999:8000"

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
